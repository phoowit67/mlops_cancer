name: GitHub Actions Demo

run-name: ${{ github.actor }} is testing out GitHub Actions

on:
  push:
  workflow_dispatch:

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest

    steps:
      - run: echo "งานนี้ถูกกระตุ้นโดย event ชนิด ${{ github.event_name }}"

      - run: echo "กำลังรันบนเครื่อง ${{ runner.os }} ที่ GitHub เตรียมไว้ให้"

      - run: echo "branch คือ ${{ github.ref }} และ repository คือ ${{ github.repository }}"

      - name: Check out repository code
        uses: actions/checkout@v4

      - run: echo "โคลน ${{ github.repository }} ลงมาที่ runner เรียบร้อย"

      - name: List files in the repository
        run: ls ${{ github.workspace }}

      - run: echo "สถานะของงานนี้คือ ${{ job.status }}"